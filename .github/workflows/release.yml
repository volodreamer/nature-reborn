name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
        default: 'v0.1.0-beta'

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - run: gradle build --no-daemon

      - name: pick playable jar
        run: |
          mkdir -p dist
          find build/libs -maxdepth 1 -type f -name 'nature-reborn-*.jar' \
            ! -name '*-sources.jar' ! -name '*dev*.jar' -print -exec cp {} dist/ \;
          ls -la dist

      - name: publish github release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Nature Reborn ${{ github.event.inputs.tag || github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: dist/*.jar
          fail_on_unmatched_files: true
